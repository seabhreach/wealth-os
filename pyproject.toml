[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-os"
version = "0.2.0"
description = "A personal wealth management platform."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Wealth OS Contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pandas>=2.2",
  "pydantic>=2.11",
  "plotly>=6.0",
  "PyYAML>=6.0",
  "streamlit>=1.49",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "pre-commit>=4.2",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-PyYAML>=6.0",
]

[project.urls]
Documentation = "https://github.com/wealth-os/wealth-os#readme"
Repository = "https://github.com/wealth-os/wealth-os"

[tool.setuptools.packages.find]
include = ["engine*", "dashboard*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["engine", "dashboard", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["dashboard", "engine"]

[tool.mypy]
python_version = "3.13"
files = ["engine", "dashboard", "tests"]
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
